        location: Lausanne, Switzerland
        start_date: 2021-09
        end_date: 2026-02
        highlights:
          - "Built **deep learning** systems for large-scale image restoration using data from **NASA** and **ESA** missions, delivering ~1000× faster inference than classical methods."
          - "Designed end-to-end ML pipelines from data simulation through model training, evaluation, and deployment — scaling large vision models across **multi-node GPU** clusters via Slurm-scheduled HPC workflows."
          - "Developed a novel **multi-resolution image fusion** framework that combines multi-telescope, multi-spectral imaging data."
          - "Mentored junior researchers on independent projects and collaborated with teams across Europe and North America."

      - company: Google Summer of Code (GSoC)
        url: https://summerofcode.withgoogle.com/
        position: Open-source Developer
        location: Remote
        start_date: 2021-05
        end_date: 2021-08
        highlights:
          - "Developed a new module for gprMax, a widely-used open-source EM simulation platform. Built an automated ML surrogate framework that reproduces computationally-expensive FDTD ground-penetrating radar simulations to high fidelity in near-real-time."

      - company: Observatoire de la Côte d'Azur
        url: https://www.oca.eu/
        position: Research Intern
        location: Nice, France
        start_date: 2021-05
        end_date: 2021-08
        highlights:
          - "Extended the 2D DeepSource algorithm to a novel 3D CNN for point-source detection on the Square Kilometre Array (SKA) Science Data Challenge, with a custom noise-aware loss recovering faint sources from a 1 TB radio datacube."

      - company: French Alternative Energies and Atomic Energy Commission (CEA)
        url: https://www.cea.fr/
        position: Research Intern
        location: Paris, France
        start_date: 2020-11
        end_date: 2021-04
        highlights:
          - "Co-developed **deep learning** deconvolution algorithms for optical and radio imaging, marking the **first application** of this technology to radio-interferometry."
          - "Contributed to a synthetic dataset of 51,000+ images using Transformer-based generative models (Tensor2Tensor), released publicly as a **community benchmark**."

